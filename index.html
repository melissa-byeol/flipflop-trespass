<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Escape Room 2D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Flip Escape Room 2D</h1>

  <!-- Selector de Modo de Juego -->
  <div class="mode-selector">
    <button id="btn-mode-keys" class="mode-btn active" onclick="switchGameMode('keys')">🔑 Modo Llaves</button>
    <button id="btn-mode-colorscape" class="mode-btn" onclick="switchGameMode('colorscape')">🎨 Colorscape</button>
  </div>

  <!-- Selector de Color / Fase -->
  <div class="color-picker-container">
    <span id="color-picker-label">Color de Ficha:</span>
    <div class="color-options">
      <button class="color-btn active" style="background-color: #facc15;" onclick="selectPlayerColor('#facc15', 'yellow', this)" aria-label="Color Amarillo"></button>
      <button class="color-btn" style="background-color: #38bdf8;" onclick="selectPlayerColor('#38bdf8', 'blue', this)" aria-label="Color Azul"></button>
      <button class="color-btn" style="background-color: #f43f5e;" onclick="selectPlayerColor('#f43f5e', 'red', this)" aria-label="Color Rojo"></button>
    </div>
  </div>

  <div class="status-bar">
    <div>Mapa Actual: <span id="map-indicator" style="color: var(--accent-blue);">AZUL</span></div>
    
    <!-- Inventario (Modo Llaves) -->
    <div id="inventory-keys" class="inventory">
      <span id="badge-blue" class="key-badge">
        <img src="assets/blue-key.png" class="badge-icon" alt="Llave Azul">
      </span>
      <span id="badge-red" class="key-badge">
        <img src="assets/red-key.png" class="badge-icon" alt="Llave Roja">
      </span>
      <span id="badge-yellow" class="key-badge">
        <img src="assets/yellow-key.png" class="badge-icon" alt="Llave Amarilla">
      </span>
      <span id="badge-stars-keys" style="color: var(--gold); margin-left: 8px;">⭐ 0/2</span>
    </div>

    <!-- Indicador Colorscape -->
    <div id="inventory-colorscape" class="inventory hidden">
      <div>Fase: <span id="color-indicator" style="color: #facc15; font-weight: bold;">AMARILLO</span></div>
      <span id="badge-stars-colors" style="color: var(--gold); margin-left: 12px;">⭐ 0/2</span>
    </div>
  </div>

  <div class="game-scene">
    <div class="grid-card" id="card">
      <div class="map-face map-blue" id="blue-grid"></div>
      <div class="map-face map-red" id="red-grid"></div>
    </div>
  </div>

  <div class="message-log" id="message">Selecciona un modo de juego para comenzar.</div>
  <div class="controls-hint">Pisa el interruptor 🔄 o usa el Brazalete (ESPACIO) para voltear el mapa (FLIP).</div>

  <!-- Controles táctiles -->
  <div class="mobile-controls">
    <div class="dpad">
      <button class="btn-touch btn-up" onclick="movePlayer(0, -1)" aria-label="Mover arriba">▲</button>
      <button class="btn-touch btn-left" onclick="movePlayer(-1, 0)" aria-label="Mover izquierda">◄</button>
      <button class="btn-touch btn-center" onclick="triggerFlipManual()" aria-label="Cambiar dimensión">🔄</button>
      <button class="btn-touch btn-right" onclick="movePlayer(1, 0)" aria-label="Mover derecha">►</button>
      <button class="btn-touch btn-down" onclick="movePlayer(0, 1)" aria-label="Mover abajo">▼</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
