<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Escape Room 2D - 3x3</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-blue: #1e293b;
      --card-red: #3b0764;
      --accent-blue: #38bdf8;
      --accent-red: #f43f5e;
      --gold: #facc15;
      --wall-color: #f8fafc;
    }

    body {
      background-color: var(--bg-color);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .status-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      font-weight: bold;
    }

    .inventory {
      display: flex;
      gap: 10px;
    }

    .key-badge {
      padding: 4px 10px;
      border-radius: 4px;
      opacity: 0.3;
      border: 1px solid #fff;
    }

    .key-badge.acquired {
      opacity: 1;
      box-shadow: 0 0 10px currentColor;
    }

    /* 3D Scene Wrapper */
    .game-scene {
      width: 300px;
      height: 300px;
      perspective: 800px;
    }

    .grid-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .grid-card.flipped {
      transform: rotateY(180deg);
    }

    /* Map Faces */
    .map-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 6px;
      box-sizing: border-box;
      gap: 0;
    }

    .map-blue {
      background-color: var(--card-blue);
      border: 3px solid var(--accent-blue);
    }

    .map-red {
      background-color: var(--card-red);
      border: 3px solid var(--accent-red);
      transform: rotateY(180deg);
    }

    /* Grid Cells */
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-sizing: border-box;
      user-select: none;
    }

    /* Borders (Paredes y Puertas) */
    .border-wall-right { border-right: 5px solid var(--wall-color); }
    .border-wall-left  { border-left: 5px solid var(--wall-color); }
    .border-wall-top   { border-top: 5px solid var(--wall-color); }
    .border-wall-bottom{ border-bottom: 5px solid var(--wall-color); }

    .border-door-blue-right { border-right: 5px dashed var(--accent-blue); }
    .border-door-blue-bottom{ border-bottom: 5px dashed var(--accent-blue); }

    .border-door-red-right  { border-right: 5px dashed var(--accent-red); }

    /* Player Token */
    .player {
      position: absolute;
      width: 32px;
      height: 32px;
      background-color: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--gold);
      z-index: 10;
      transition: all 0.15s ease-out;
      pointer-events: none;
    }

    /* Controls & Message */
    .message-log {
      margin-top: 20px;
      min-height: 24px;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <h1>Flip Escape Room 2D</h1>

  <div class="status-bar">
    <div>Mapa Actual: <span id="map-indicator" style="color: var(--accent-blue);">AZUL</span></div>
    <div class="inventory">
      <span id="badge-blue" class="key-badge" style="color: var(--accent-blue);">🔑 Azul</span>
      <span id="badge-red" class="key-badge" style="color: var(--accent-red);">🔑 Roja</span>
      <span id="badge-stars" style="color: var(--gold);">⭐ 0/3</span>
    </div>
  </div>

  <div class="game-scene">
    <div class="grid-card" id="card">
      <div class="map-face map-blue" id="blue-grid"></div>
      <div class="map-face map-red" id="red-grid"></div>
    </div>
  </div>

  <div class="message-log" id="message">Usa W, A, S, D o Flechas para moverte.</div>
  <div class="controls-hint">Pisa el interruptor 🔄 para voltear el mapa (FLIP).</div>

  <script>
    // --- ESTADO DEL JUEGO ---
    const gameState = {
      player: { x: 0, y: 2 },
      currentSide: 'blue', // 'blue' o 'red'
      keys: { blue: false, red: false },
      starsCollected: 0,
      totalStars: 3
    };

    // --- CONFIGURACIÓN DE LOS MAPAS ---
    const blueMapConfig = {
      grid: [
        [{ item: null },       { item: 'FLIP' },     { item: 'STAR' }], // Fila 0
        [{ item: null },       { item: 'KEY_BLUE' }, { item: null }],   // Fila 1
        [{ item: 'SPAWN' },    { item: 'STAR' },     { item: null }]    // Fila 2
      ],
      borders: [
        { x: 1, y: 0, dir: 'right', type: 'wall' },
        { x: 2, y: 1, dir: 'right', type: 'door-red' },
        { x: 1, y: 2, dir: 'right', type: 'door-blue' },
        { x: 1, y: 2, dir: 'up', type: 'wall' },
        { x: 1, y: 2, dir: 'left', type: 'wall' }
      ]
    };

    const redMapConfig = {
      grid: [
        [{ item: null }, { item: null },       { item: 'FLIP' }],   // Fila 0
        [{ item: null }, { item: 'STAR' },     { item: null }],     // Fila 1
        [{ item: null }, { item: 'KEY_RED' },  { item: null }]      // Fila 2
      ],
      borders: [
        { x: 1, y: 1, dir: 'right', type: 'wall' },
        { x: 1, y: 1, dir: 'left', type: 'wall' },
        { x: 1, y: 1, dir: 'up', type: 'wall' },
        { x: 1, y: 0, dir: 'down', type: 'door-blue' }
      ]
    };

    // --- RENDERIZADO DEL MAPA ---
    function renderGrid(containerId, config) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.x = x;
          cell.dataset.y = y;

          const item = config.grid[y][x].item;
          if (item === 'FLIP') cell.innerText = '🔄';
          else if (item === 'KEY_BLUE') cell.innerText = '🔑';
          else if (item === 'KEY_RED') cell.innerText = '🔑';
          else if (item === 'STAR') cell.innerText = '⭐';
          else if (item === 'SPAWN') cell.innerText = '🚩';

          container.appendChild(cell);
        }
      }

      // Aplicar Bordes
      config.borders.forEach(b => {
        const selector = `#${containerId} .cell[data-x="${b.x}"][data-y="${b.y}"]`;
        const cell = document.querySelector(selector);
        if (cell) cell.classList.add(`border-${b.type}-${b.dir}`);
      });
    }

    function createPlayerToken() {
      const token = document.createElement('div');
      token.className = 'player';
      token.id = 'player-token';
      document.body.appendChild(token);
      updatePlayerPosition();
    }

    function updatePlayerPosition() {
      const side = gameState.currentSide;
      const cell = document.querySelector(`#${side}-grid .cell[data-x="${gameState.player.x}"][data-y="${gameState.player.y}"]`);
      const token = document.getElementById('player-token');

      if (cell && token) {
        const rect = cell.getBoundingClientRect();
        token.style.left = `${rect.left + rect.width / 2 - 16}px`;
        token.style.top = `${rect.top + rect.height / 2 - 16}px`;
      }
    }

    // --- LÓGICA DE MOVIMIENTO Y COLISIONES ---
    function movePlayer(dx, dy) {
      const targetX = gameState.player.x + dx;
      const targetY = gameState.player.y + dy;

      if (targetX < 0 || targetX > 2 || targetY < 0 || targetY > 2) return;

      const currentConfig = gameState.currentSide === 'blue' ? blueMapConfig : redMapConfig;

      // Comprobar Bloqueos en Bordes
      let blocked = false;
      let dirStr = dx === 1 ? 'right' : dx === -1 ? 'left' : dy === 1 ? 'bottom' : 'top';

      currentConfig.borders.forEach(b => {
        if (b.x === gameState.player.x && b.y === gameState.player.y && b.dir === dirStr) {
          if (b.type === 'wall') blocked = true;
          if (b.type === 'door-blue' && !gameState.keys.blue) {
            blocked = true;
            showMessage('🚪 Necesitas la Llave Azul para pasar por aquí.');
          }
          if (b.type === 'door-red' && !gameState.keys.red) {
            blocked = true;
            showMessage('🚪 Necesitas la Llave Roja para pasar por aquí.');
          }
        }
      });

      if (blocked) return;

      // Actualizar posición
      gameState.player.x = targetX;
      gameState.player.y = targetY;
      updatePlayerPosition();
      checkCellInteractions();
    }

    function checkCellInteractions() {
      const side = gameState.currentSide;
      const config = side === 'blue' ? blueMapConfig : redMapConfig;
      const cellData = config.grid[gameState.player.y][gameState.player.x];

      if (!cellData.item) return;

      if (cellData.item === 'KEY_BLUE') {
        gameState.keys.blue = true;
        cellData.item = null;
        document.getElementById('badge-blue').classList.add('acquired');
        showMessage('🔑 ¡Conseguiste la Llave Azul!');
      } else if (cellData.item === 'KEY_RED') {
        gameState.keys.red = true;
        cellData.item = null;
        document.getElementById('badge-red').classList.add('acquired');
        showMessage('🔑 ¡Conseguiste la Llave Roja!');
      } else if (cellData.item === 'STAR') {
        gameState.starsCollected++;
        cellData.item = null;
        document.getElementById('badge-stars').innerText = `⭐ ${gameState.starsCollected}/${gameState.totalStars}`;
        showMessage('⭐ ¡Recogiste una estrella!');
        if (gameState.starsCollected === gameState.totalStars) {
          showMessage('🎉 ¡FELICIDADES! ¡Has recolectado todas las estrellas y escapado!');
        }
      } else if (cellData.item === 'FLIP') {
        triggerFlip();
      }

      renderGrid(`${side}-grid`, config);
    }

    function triggerFlip() {
      const card = document.getElementById('card');
      const newSide = gameState.currentSide === 'blue' ? 'red' : 'blue';

      gameState.currentSide = newSide;
      card.classList.toggle('flipped');

      const indicator = document.getElementById('map-indicator');
      indicator.innerText = newSide.toUpperCase();
      indicator.style.color = newSide === 'blue' ? 'var(--accent-blue)' : 'var(--accent-red)';

      showMessage(`🔄 ¡FLIP! Ahora estás en el Mapa ${newSide.toUpperCase()}`);
      setTimeout(updatePlayerPosition, 300);
    }

    function showMessage(msg) {
      document.getElementById('message').innerText = msg;
    }

    // --- CONTROLES TECLADO ---
    window.addEventListener('keydown', (e) => {
      switch (e.key.toLowerCase()) {
        case 'w': case 'arrowup': movePlayer(0, -1); break;
        case 's': case 'arrowdown': movePlayer(0, 1); break;
        case 'a': case 'arrowleft': movePlayer(-1, 0); break;
        case 'd': case 'arrowright': movePlayer(1, 0); break;
      }
    });

    window.addEventListener('resize', updatePlayerPosition);

    // --- INICIALIZACIÓN ---
    renderGrid('blue-grid', blueMapConfig);
    renderGrid('red-grid', redMapConfig);
    createPlayerToken();
  </script>
</body>
</html>
