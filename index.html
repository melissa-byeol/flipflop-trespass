<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Escape Room 2D - Ultimate Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>🎮 Flip Escape Room 2D</h1>

  <!-- Selector de Modo de Juego -->
  <div class="mode-selector">
    <button id="btn-mode-keys" class="mode-btn active" onclick="switchGameMode('keys')">🔑 Modo Llaves</button>
    <button id="btn-mode-colorscape" class="mode-btn" onclick="switchGameMode('colorscape')">🎨 Colorscape</button>
  </div>

  <!-- Selector de Color / Fase -->
  <div class="color-picker-container">
    <span id="color-picker-label">Color de Ficha:</span>
    <div class="color-options">
      <button class="color-btn active" style="background-color: #facc15;" onclick="selectPlayerColor('#facc15', 'yellow', this)" aria-label="Color Amarillo"></button>
      <button class="color-btn" style="background-color: #38bdf8;" onclick="selectPlayerColor('#38bdf8', 'blue', this)" aria-label="Color Azul"></button>
      <button class="color-btn" style="background-color: #f43f5e;" onclick="selectPlayerColor('#f43f5e', 'red', this)" aria-label="Color Rojo"></button>
      <button class="color-btn hidden" id="btn-green" style="background-color: #22c55e;" onclick="selectPlayerColor('#22c55e', 'green', this)" aria-label="Color Verde"></button>
      <button class="color-btn hidden" id="btn-purple" style="background-color: #a855f7;" onclick="selectPlayerColor('#a855f7', 'purple', this)" aria-label="Color Morado"></button>
    </div>
  </div>

  <div class="status-bar">
    <div>Nivel: <span id="level-indicator" style="color: var(--accent-blue);">1</span>/10</div>
    <div>Mapa: <span id="map-indicator" style="color: var(--accent-blue);">AZUL</span></div>
    
    <!-- Inventario Grid -->
    <div class="inventory-container">
      <div class="inventory-grid">
        <div class="inventory-slot" data-slot="0"><span class="slot-number">1</span><div class="item-placeholder"></div></div>
        <div class="inventory-slot" data-slot="1"><span class="slot-number">2</span><div class="item-placeholder"></div></div>
        <div class="inventory-slot" data-slot="2"><span class="slot-number">3</span><div class="item-placeholder"></div></div>
        <div class="inventory-slot" data-slot="3"><span class="slot-number">4</span><div class="item-placeholder"></div></div>
        <div class="inventory-slot" data-slot="4"><span class="slot-number">5</span><div class="item-placeholder"></div></div>
        <div class="inventory-slot" data-slot="5"><span class="slot-number">6</span><div class="item-placeholder"></div></div>
      </div>
    </div>

    <!-- Indicador Colorscape -->
    <div id="inventory-colorscape" class="inventory hidden">
      <div>Fase: <span id="color-indicator" style="color: #facc15; font-weight: bold;">AMARILLO</span></div>
      <span id="badge-stars-colors" style="color: var(--gold); margin-left: 12px;">⭐ 0/3</span>
    </div>
  </div>

  <div class="game-scene">
    <div class="grid-card" id="card">
      <div class="map-face map-blue" id="blue-grid"></div>
      <div class="map-face map-red" id="red-grid"></div>
    </div>
  </div>

  <div class="message-log" id="message">Selecciona un modo de juego para comenzar.</div>
  <div class="controls-hint">WASD/Flechas: Mover | ESPACIO: Flip | Recoge todas las ⭐ para avanzar</div>

  <!-- Controles táctiles -->
  <div class="mobile-controls">
    <div class="dpad">
      <button class="btn-touch btn-up" onclick="movePlayer(0, -1)" aria-label="Mover arriba">▲</button>
      <button class="btn-touch btn-left" onclick="movePlayer(-1, 0)" aria-label="Mover izquierda">◄</button>
      <button class="btn-touch btn-center" onclick="triggerFlipManual()" aria-label="Cambiar dimensión">🔄</button>
      <button class="btn-touch btn-right" onclick="movePlayer(1, 0)" aria-label="Mover derecha">►</button>
      <button class="btn-touch btn-down" onclick="movePlayer(0, 1)" aria-label="Mover abajo">▼</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
