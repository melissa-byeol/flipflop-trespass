<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Escape Room 2D - 3x3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Flip Escape Room 2D</h1>

  <div class="status-bar">
    <div>Mapa Actual: <span id="map-indicator" style="color: var(--accent-blue);">AZUL</span></div>
    <div class="inventory">
      <span id="badge-blue" class="key-badge" style="color: var(--accent-blue);">🔑 Azul</span>
      <span id="badge-red" class="key-badge" style="color: var(--accent-red);">🔑 Roja</span>
      <span id="badge-stars" style="color: var(--gold);">⭐ 0/3</span>
    </div>
  </div>

  <div class="game-scene">
    <div class="grid-card" id="card">
      <div class="map-face map-blue" id="blue-grid"></div>
      <div class="map-face map-red" id="red-grid"></div>
    </div>
  </div>

  <div class="message-log" id="message">Usa W, A, S, D, Flechas o los botones táctiles para moverte.</div>
  <div class="controls-hint">Pisa el interruptor 🔄 para voltear el mapa (FLIP).</div>

  <!-- Controles táctiles para dispositivos móviles / tablets -->
  <div class="mobile-controls">
    <div class="dpad">
      <button class="btn-touch btn-up" onclick="movePlayer(0, -1)" aria-label="Mover arriba">▲</button>
      <button class="btn-touch btn-left" onclick="movePlayer(-1, 0)" aria-label="Mover izquierda">◄</button>
      <button class="btn-touch btn-center" onclick="triggerFlipManual()" aria-label="Cambiar dimensión">🔄</button>
      <button class="btn-touch btn-right" onclick="movePlayer(1, 0)" aria-label="Mover derecha">►</button>
      <button class="btn-touch btn-down" onclick="movePlayer(0, 1)" aria-label="Mover abajo">▼</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
